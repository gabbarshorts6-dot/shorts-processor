
<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shorts Processor</title>
<style>
body {
  background:#101019;
  color:white;
  font-family:Arial,sans-serif;
  display:flex;
  justify-content:center;
  padding:30px 15px;
}
.card {
  background:#1c1c2b;
  width:100%;
  max-width:500px;
  padding:30px 20px;
  border-radius:25px;
  text-align:center;
  margin-top:40px;
}
h1 {color:#a77bff;font-size:40px}
input[type=file] {
  display:block;
  width:90%;
  margin:25px auto;
  padding:15px;
  background:#29293a;
  color:white;
  border-radius:12px;
}
button {
  background:#7b2ff7;
  color:white;
  border:0;
  padding:20px;
  width:95%;
  border-radius:15px;
  font-size:22px;
  font-weight:bold;
}
#result {margin-top:20px;word-wrap:break-word}
a {color:#b99aff}
</style>
</head>
<body>
<div class="card">
<h1>🎬 Shorts Processor</h1>
<p>Select a video from your phone</p>

<input type="file" id="video" accept="video/*">

<button onclick="processVideo()">🚀 Make Short</button>

<div id="result"></div>
</div>

<script>
async function processVideo() {
  const file = document.getElementById("video").files[0];
  const result = document.getElementById("result");

  if (!file) {
    result.innerHTML = "❌ Please select a video";
    return;
  }

  result.innerHTML = "⏳ Uploading and processing... Please wait";

  const form = new FormData();
  form.append("file", file);

  try {
    const response = await fetch("/process", {
      method: "POST",
      body: form
    });

    const data = await response.json();

    if (data.download_url) {
      result.innerHTML =
        '✅ Ready! <br><br><a href="' +
        data.download_url +
        '">⬇️ Download Short</a>';
    } else {
      result.innerHTML = "❌ " + (data.error || "Processing failed");
    }
  } catch (e) {
    result.innerHTML = "❌ Server error: " + e.message;
  }
}
</script>
</body>
</html>
